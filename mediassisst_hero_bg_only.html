
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  .bg{
    width:100%;
    min-height:580px;
    background:#050e0a;
    position:relative;
    overflow:hidden;
  }
  .bg::before{
    content:'';
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(0,200,140,.065) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,140,.065) 1px, transparent 1px);
    background-size:52px 52px;
  }
  .bg::after{
    content:'';
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:700px;height:460px;
    background:radial-gradient(ellipse at center, rgba(0,200,130,.14) 0%, transparent 68%);
    pointer-events:none;
  }
  .orb{position:absolute;border-radius:50%;pointer-events:none;}
  .o1{width:380px;height:380px;top:-120px;left:-100px;
      background:radial-gradient(circle, rgba(0,220,140,.11) 0%, transparent 68%);}
  .o2{width:300px;height:300px;bottom:-80px;right:-60px;
      background:radial-gradient(circle, rgba(0,180,120,.13) 0%, transparent 68%);}
  .o3{width:200px;height:200px;top:60px;right:100px;
      background:radial-gradient(circle, rgba(100,255,180,.07) 0%, transparent 70%);}
  .o4{width:160px;height:160px;bottom:80px;left:120px;
      background:radial-gradient(circle, rgba(0,210,130,.07) 0%, transparent 70%);}
  .corner{position:absolute;width:44px;height:44px;pointer-events:none;}
  .ctl{top:18px;left:18px;border-top:1.5px solid rgba(0,200,130,.28);border-left:1.5px solid rgba(0,200,130,.28);}
  .ctr{top:18px;right:18px;border-top:1.5px solid rgba(0,200,130,.28);border-right:1.5px solid rgba(0,200,130,.28);}
  .cbl{bottom:18px;left:18px;border-bottom:1.5px solid rgba(0,200,130,.28);border-left:1.5px solid rgba(0,200,130,.28);}
  .cbr{bottom:18px;right:18px;border-bottom:1.5px solid rgba(0,200,130,.28);border-right:1.5px solid rgba(0,200,130,.28);}
</style>

<div class="bg">
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
  <div class="orb o4"></div>
  <div class="corner ctl"></div>
  <div class="corner ctr"></div>
  <div class="corner cbl"></div>
  <div class="corner cbr"></div>

  <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;"
       viewBox="0 0 900 580" preserveAspectRatio="xMidYMid slice">

    <!-- vertical dashed accent lines -->
    <line x1="42" y1="60" x2="42" y2="520" stroke="#00c88c" stroke-width=".6" opacity=".09" stroke-dasharray="5 8"/>
    <line x1="858" y1="60" x2="858" y2="520" stroke="#00c88c" stroke-width=".6" opacity=".09" stroke-dasharray="5 8"/>
    <line x1="200" y1="0" x2="200" y2="580" stroke="#00c88c" stroke-width=".4" opacity=".04" stroke-dasharray="3 10"/>
    <line x1="700" y1="0" x2="700" y2="580" stroke="#00c88c" stroke-width=".4" opacity=".04" stroke-dasharray="3 10"/>

    <!-- horizontal dashed accent lines -->
    <line x1="0" y1="140" x2="900" y2="140" stroke="#00c88c" stroke-width=".4" opacity=".05" stroke-dasharray="4 9"/>
    <line x1="0" y1="440" x2="900" y2="440" stroke="#00c88c" stroke-width=".4" opacity=".05" stroke-dasharray="4 9"/>

    <!-- circuit nodes top-left cluster -->
    <circle cx="80" cy="95"  r="3"   fill="#00c88c" opacity=".22"/>
    <circle cx="80" cy="95"  r="7"   fill="none" stroke="#00c88c" stroke-width=".6" opacity=".14"/>
    <circle cx="80" cy="95"  r="12"  fill="none" stroke="#00c88c" stroke-width=".4" opacity=".07"/>
    <line x1="80"  y1="95"  x2="160" y2="95"  stroke="#00c88c" stroke-width=".5" opacity=".1"/>
    <line x1="160" y1="95"  x2="160" y2="42"  stroke="#00c88c" stroke-width=".5" opacity=".1"/>
    <circle cx="160" cy="42" r="2.5" fill="#00c88c" opacity=".18"/>
    <line x1="80"  y1="95"  x2="80"  y2="160" stroke="#00c88c" stroke-width=".5" opacity=".08"/>
    <circle cx="80" cy="160" r="2"   fill="#00c88c" opacity=".14"/>

    <!-- circuit nodes top-right cluster -->
    <circle cx="820" cy="110" r="3"  fill="#00c88c" opacity=".22"/>
    <circle cx="820" cy="110" r="7"  fill="none" stroke="#00c88c" stroke-width=".6" opacity=".14"/>
    <circle cx="820" cy="110" r="12" fill="none" stroke="#00c88c" stroke-width=".4" opacity=".07"/>
    <line x1="820" y1="110" x2="740" y2="110" stroke="#00c88c" stroke-width=".5" opacity=".1"/>
    <line x1="740" y1="110" x2="740" y2="42"  stroke="#00c88c" stroke-width=".5" opacity=".1"/>
    <circle cx="740" cy="42"  r="2.5" fill="#00c88c" opacity=".18"/>
    <line x1="820" y1="110" x2="820" y2="180" stroke="#00c88c" stroke-width=".5" opacity=".08"/>
    <circle cx="820" cy="180" r="2"  fill="#00c88c" opacity=".14"/>

    <!-- circuit nodes bottom-left cluster -->
    <circle cx="110" cy="480" r="3"  fill="#00c88c" opacity=".18"/>
    <circle cx="110" cy="480" r="7"  fill="none" stroke="#00c88c" stroke-width=".6" opacity=".11"/>
    <line x1="110" y1="480" x2="200" y2="480" stroke="#00c88c" stroke-width=".5" opacity=".09"/>
    <line x1="200" y1="480" x2="200" y2="540" stroke="#00c88c" stroke-width=".5" opacity=".07"/>
    <circle cx="200" cy="540" r="2"  fill="#00c88c" opacity=".12"/>

    <!-- circuit nodes bottom-right cluster -->
    <circle cx="790" cy="470" r="3"  fill="#00c88c" opacity=".18"/>
    <circle cx="790" cy="470" r="7"  fill="none" stroke="#00c88c" stroke-width=".6" opacity=".11"/>
    <line x1="790" y1="470" x2="700" y2="470" stroke="#00c88c" stroke-width=".5" opacity=".09"/>
    <line x1="700" y1="470" x2="700" y2="540" stroke="#00c88c" stroke-width=".5" opacity=".07"/>
    <circle cx="700" cy="540" r="2"  fill="#00c88c" opacity=".12"/>

    <!-- mid-left crosshair -->
    <line x1="52"  y1="290" x2="76"  y2="290" stroke="#00c88c" stroke-width=".7" opacity=".18"/>
    <line x1="64"  y1="278" x2="64"  y2="302" stroke="#00c88c" stroke-width=".7" opacity=".18"/>
    <circle cx="64" cy="290" r="2"   fill="#00c88c" opacity=".25"/>

    <!-- mid-right crosshair -->
    <line x1="824" y1="310" x2="848" y2="310" stroke="#00c88c" stroke-width=".7" opacity=".18"/>
    <line x1="836" y1="298" x2="836" y2="322" stroke="#00c88c" stroke-width=".7" opacity=".18"/>
    <circle cx="836" cy="310" r="2"  fill="#00c88c" opacity=".25"/>

    <!-- scattered small dots -->
    <circle cx="310" cy="55"  r="1.5" fill="#00e89a" opacity=".2"/>
    <circle cx="590" cy="55"  r="1.5" fill="#00e89a" opacity=".2"/>
    <circle cx="450" cy="30"  r="1"   fill="#00e89a" opacity=".18"/>
    <circle cx="145" cy="340" r="1.5" fill="#00c88c" opacity=".16"/>
    <circle cx="755" cy="340" r="1.5" fill="#00c88c" opacity=".16"/>
    <circle cx="230" cy="510" r="1.5" fill="#00c88c" opacity=".13"/>
    <circle cx="670" cy="510" r="1.5" fill="#00c88c" opacity=".13"/>
    <circle cx="450" cy="560" r="1.5" fill="#00e89a" opacity=".15"/>

    <!-- thin diagonal accent lines — top -->
    <line x1="160" y1="0"  x2="280" y2="140" stroke="#00c88c" stroke-width=".4" opacity=".05"/>
    <line x1="740" y1="0"  x2="620" y2="140" stroke="#00c88c" stroke-width=".4" opacity=".05"/>

    <!-- thin diagonal accent lines — bottom -->
    <line x1="160" y1="580" x2="280" y2="440" stroke="#00c88c" stroke-width=".4" opacity=".04"/>
    <line x1="740" y1="580" x2="620" y2="440" stroke="#00c88c" stroke-width=".4" opacity=".04"/>

    <!-- subtle horizontal scan lines across centre -->
    <rect x="0" y="270" width="900" height="1" fill="#00c88c" opacity=".04"/>
    <rect x="0" y="310" width="900" height="1" fill="#00c88c" opacity=".03"/>

    <!-- top-center tiny pip -->
    <circle cx="450" cy="18" r="2.5" fill="#00c88c" opacity=".2"/>
    <line x1="450" y1="21" x2="450" y2="50" stroke="#00c88c" stroke-width=".5" opacity=".1"/>

    <!-- bottom-center tiny pip -->
    <circle cx="450" cy="562" r="2.5" fill="#00c88c" opacity=".18"/>
    <line x1="450" y1="530" x2="450" y2="559" stroke="#00c88c" stroke-width=".5" opacity=".09"/>
  </svg>
</div>
